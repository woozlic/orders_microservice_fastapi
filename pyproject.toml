[project]
name = "orders-microservice-fastapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "woozlic", email = "sampaccs@mail.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.2",
    "asyncpg>=0.31.0",
    "celery[redis]>=5.6.3",
    "environs>=15.2.0",
    "fastapi[standard]>=0.141.1",
    "jwt>=1.4.0",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
orders-microservice-fastapi = "orders_microservice_fastapi:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
