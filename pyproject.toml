[project]
name = "orders-microservice-fastapi"
version = "0.1.0"
description = "Сервис управления заказами на FastAPI"
readme = "README.md"
authors = [
    { name = "woozlic", email = "sampaccs@mail.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "aiokafka>=0.14.0",
    "alembic>=1.19.2",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "celery[redis]>=5.6.3",
    "fastapi[standard]>=0.141.1",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "pyjwt>=2.13.0",
    "sqlalchemy>=2.0.52",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
